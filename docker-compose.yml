# CloudOrbit local stack: postgres, redis, api (runs migrations), celery worker + beat, frontend.
#   cp .env.example .env            # then set JWT_SECRET_KEY / CREDENTIALS_ENCRYPTION_KEYS
#   docker compose up -d --build
#   docker compose exec api python -m app.seed      # optional demo data (mock providers)
name: cloudorbit

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mcmp}:${POSTGRES_PASSWORD:-mcmp}@postgres:5432/${POSTGRES_DB:-mcmp}
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcmp}
      POSTGRES_DB: ${POSTGRES_DB:-mcmp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
