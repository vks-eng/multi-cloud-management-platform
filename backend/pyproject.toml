[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmp-backend"
version = "1.0.0"
description = "Multi-Cloud Management Platform - FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real cloud SDKs are optional. The default install runs entirely on mock adapters.
aws = ["boto3>=1.35"]
azure = [
    "azure-identity>=1.17",
    "azure-mgmt-resource>=23.1",
    "azure-mgmt-compute>=33.0",
    "azure-mgmt-storage>=21.2",
]
gcp = ["google-cloud-compute>=1.19", "google-cloud-storage>=2.18", "google-cloud-resource-manager>=1.12"]
cloud = ["mcmp-backend[aws,azure,gcp]"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    # Embedded PostgreSQL binaries for running the test-suite without a local server.
    # Wheels exist for CPython <= 3.12; on newer interpreters set TEST_DATABASE_URL or PG_BIN_DIR.
    "pgserver>=0.1.4; python_version < '3.13'",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["infrastructure/templates/*.tf.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S105",   # false positives on token type literals
    "S106",
    "RUF012",
    "E501",   # line length is handled by `ruff format`; long string literals are allowed
    "UP046",  # keep typing.Generic for Pydantic generic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "N818"]
"app/providers/mock.py" = ["S311"]  # non-crypto randomness for simulated data
"app/seed.py" = ["S311"]
"app/infrastructure/runner.py" = ["S603", "S607"]  # controlled subprocess invocation of terraform

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
