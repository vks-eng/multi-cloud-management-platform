name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  backend-tests:
    name: Backend tests (pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcmp
          POSTGRES_PASSWORD: mcmp
          POSTGRES_DB: mcmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcmp -d mcmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mcmp:mcmp@localhost:5432/mcmp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Upload coverage and test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Vitest
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
